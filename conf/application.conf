# Openwalrus settings. Everything that differs between machines comes from the environment;
# see template.env.local (development) and template.env.docker (a server).

play.application.loader = "OpenwalrusLoader"

# Signs the session cookie. Play refuses to start in production with this placeholder,
# so a server must set APP_SECRET (openssl rand -hex 32).
play.http.secret.key = "changeme"
play.http.secret.key = ${?APP_SECRET}

play.i18n.langs = [ "en" ]
play.http.errorHandler = "play.api.http.JsonHttpErrorHandler"

# Signed-in sessions last 30 days.
play.http.session.maxAge = 30 days
play.http.session.sameSite = "lax"

# The web client sends X-Requested-With on every request, and the CSRF filter lets those
# through: a page on another site cannot add that header without the browser asking this
# server first, which it refuses. Anything else that carries the session cookie and changes
# something is refused.
play.filters.csrf.header.bypassHeaders {
  X-Requested-With = "*"
}
play.filters.enabled += "play.filters.gzip.GzipFilter"

# The client's bundles have a hash of their contents in the name, so they can be kept
# forever. index.html, which names them, is never cached (FrontendController).
play.assets.cache."/public/assets/" = "public, max-age=31536000, immutable"

# Image uploads.
play.http.parser.maxDiskBuffer = 10MB

# MONGO_URI: a standard MongoDB connection string. The database is the path part.
mongodb.uri = "mongodb://localhost:27017/openwalrus"
mongodb.uri = ${?MONGO_URI}

openwalrus {
  # Set ALLOW_REGISTRATION=false once everyone in your group has an account.
  allowRegistration = true
  allowRegistration = ${?ALLOW_REGISTRATION}
}
